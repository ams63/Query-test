# One-click deploy on Render (https://render.com): New → Blueprint → pick this repository.
services:
  - type: web
    name: query-api
    runtime: docker
    rootDir: backend
    plan: starter            # needed for a persistent disk
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /data/query.db
      - key: PUBLIC_URL
        sync: false          # set to https://<your-service>.onrender.com or your domain
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SIGHTENGINE_USER
        sync: false
      - key: SIGHTENGINE_SECRET
        sync: false
      - key: APPLE_CLIENT_IDS
        value: com.query.app
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: ANDROID_SHA256
        sync: false
      - key: APP_DOWNLOAD_URL
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ORG_ID
        sync: false
      - key: LINKEDIN_ORG_TOKEN
        sync: false
    disk:
      name: query-data
      mountPath: /data
      sizeGB: 10
